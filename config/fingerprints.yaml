# Passive product and panel fingerprints.
#
# WHAT THIS IS FOR
# The single highest-value attack-surface question is "what is reachable that
# should not be?" — an admin console, a CI server, a database UI, a monitoring
# dashboard. Upstream catalogues cover this with hundreds of templates that each
# request a specific path. We cannot do that: nothing here sends a packet.
#
# So these fingerprints match only what a scan already returned:
#
#   title    the page title (httpx default)
#   tech     technology names from -tech-detect
#   cpe      CPE product strings
#   server   the Server header via -web-server
#   body     response body, ONLY when the scan used -body-preview
#   favicon  favicon MD5, ONLY when the scan used -favicon
#   port     the port it answered on
#
# That is a real limitation and it is stated rather than hidden: a panel sitting
# at /admin on a host whose root page is a marketing site will NOT be found here.
# `frogscope suggest-httpx` says which flags widen the net.
#
# WHY GROUPS
# `exposure` is what a reviewer acts on, and it differs by product even at equal
# confidence. A public Grafana is embarrassing; a public Jenkins is a breach
# waiting to happen, because Jenkins runs code by design.
#
#   admin_panel        general administrative interface
#   infra_console      controls servers, clusters, or containers
#   ci_cd              can build or deploy code — treat as production access
#   database_ui        direct data access
#   monitoring         observability, often with credentials inside
#   network_device     router, firewall, VPN, load balancer
#   dev_tool           source control, artefact stores, issue trackers
#   webmail            mail access
#   storage            object storage or file transfer
#   iot                cameras, printers, building systems
#
# MAINTENANCE
# `source:` records provenance. See README.md (Maintenance) for how to
# re-review against upstream and what was deliberately left out.

version: 3

# Confidence in the MATCH, separate from how bad the exposure is. A default
# install page proves the product; a generic word in a title only suggests it.
match_confidence:
  confirmed: A product-specific string or favicon hash that nothing else emits
  probable:  A distinctive title or technology combination
  possible:  A generic word that other products also use

# ── Panels and consoles ─────────────────────────────────────────────────────
# Ordered within each group by how much authority the product carries. Each entry
# needs `id`, `product`, `group`, and at least one matcher.

panels:
  # ── CI/CD: anything here can usually run code on the build host ────────────
  - id: PANEL_JENKINS
    product: Jenkins
    group: ci_cd
    title: ['^Dashboard \[Jenkins\]', 'Jenkins \[Jenkins\]']
    tech: [Jenkins]
    body: ['Welcome to Jenkins!', 'jenkins-session']
    confidence: confirmed
    note: >
      Jenkins executes arbitrary build steps. An unauthenticated instance is
      remote code execution by design, not a misconfiguration to schedule.

