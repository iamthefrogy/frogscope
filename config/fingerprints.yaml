# ── Information disclosure visible without probing ──────────────────────────
# Only what a root-page response can reveal. Anything needing a path request
# (/.git, /.env, /backup.zip) is intentionally absent — see the docs.

disclosure:
  - id: DISCLOSE_DIR_LISTING
    label: Directory listing enabled
    title: ['^Index of /', '^Directory Listing', '^Directory listing for']
    severity: medium
    why: >
      The web server enumerates files instead of serving a page, so anything left
      in the directory is browsable.

  - id: DISCLOSE_STACK_TRACE
    label: Stack trace or debug output
    title: ['Whitelabel Error Page', 'Stack Trace', 'Traceback \(most recent',
            'Server Error in .* Application', 'Fatal error:', 'Warning: ',
            'Undefined variable', 'ORA-\d{5}', 'SQLSTATE\[']
    severity: medium
    why: >
      Error output typically names internal paths, library versions, and
      sometimes database structure.

  - id: DISCLOSE_PHPINFO
    label: phpinfo() output
    title: ['phpinfo\(\)', 'PHP Version \d']
    severity: high
    why: >
      phpinfo lists the full configuration, loaded modules, absolute paths, and
      often environment variables.

  - id: DISCLOSE_SERVER_STATUS
    label: Server status page
    title: ['Apache Status', 'Server Status', 'nginx status']
    severity: medium
    why: Live request URLs and client addresses, which can include session tokens.

  - id: DISCLOSE_ENV_IN_BODY
    label: Configuration values in the response
    body: ['DB_PASSWORD=', 'AWS_SECRET_ACCESS_KEY', 'BEGIN RSA PRIVATE KEY',
           'BEGIN OPENSSH PRIVATE KEY', 'xoxb-', 'ghp_[A-Za-z0-9]{36}']
    severity: critical
    requires_fields: [body_preview]
    why: >
      A credential in a response body should be treated as already compromised —
      assume it has been indexed.

  - id: DISCLOSE_VERSION_BANNER
    label: Version in the Server header
    server: ['/\d+\.\d+']
    severity: low
    why: >
      A precise version tells an attacker which published flaws to try without
      testing for them.

# ── Cloud storage exposure ──────────────────────────────────────────────────
storage_exposure:
  - id: STORAGE_S3_LISTABLE
    product: Amazon S3
    body: ['<ListBucketResult', '<Name>.*</Name><Prefix>']
    severity: high
    requires_fields: [body_preview]
    why: The bucket lists its contents to anonymous callers.
  - id: STORAGE_AZURE_BLOB_LISTABLE
    product: Azure Blob Storage
    body: ['<EnumerationResults', 'ContainerName=']
    severity: high
    requires_fields: [body_preview]
  - id: STORAGE_GCS_LISTABLE
    product: Google Cloud Storage
    body: ['<ListBucketResult', 'storage.googleapis.com']
    severity: high
    requires_fields: [body_preview]
  - id: STORAGE_BUCKET_MISSING
    product: Object storage
    body: ['<Code>NoSuchBucket</Code>', 'The specified bucket does not exist']
    severity: high
    requires_fields: [body_preview]
    why: >
      The bucket name is unclaimed. Whoever registers it next serves content from
      this hostname.
