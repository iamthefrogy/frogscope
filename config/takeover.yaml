# Subdomain-takeover fingerprints.
#
# Graded, never asserted. A dangling CNAME is a *candidate* until someone
# verifies it, and no network request is made during ingest — so nothing here can
# be promoted to "confirmed" without the opt-in `verify --takeover` step.
#
# The grading matters because two very different conditions look similar:
#
#   Cloudflare 530 (error 1016) = the origin DNS record does not resolve.
#     The hostname points at nothing. That is a takeover signal.
#   Cloudflare 525/526          = the origin resolves and answers, but its TLS
#     is broken. That is an availability bug, NOT a takeover.
#
# Conflating them generates false takeover alerts, which is how a findings feed
# loses credibility.
#
# `source:` records where an entry came from, so a later refresh can tell which
# entries are ours and which mirror an upstream catalogue. See
# README.md (Maintenance) for the review procedure.
#
# `body_fingerprints` only fire when the scan collected response bodies
# (httpx -body-preview). Without that data an entry degrades to CNAME-suffix
# matching, which is why a claimable provider with no body match grades `medium`
# rather than `high`.

grades:
  high:
    label: Likely dangling
    confidence: probable
    description: 'A provider-specific "this resource does not exist" fingerprint, or an edge reporting
      that the origin DNS record is missing.

      '
  medium:
    label: Possible dangling
    confidence: possible
    description: 'The hostname delegates to a provider where unclaimed names can be registered by anyone,
      and it is not currently serving.

      '
  low:
    label: Worth checking
    confidence: possible
    description: 'Delegated to a third-party provider and returning an error, but the provider does not
      allow arbitrary name claiming.

      '
dangling_origin_health:
- dns_missing
