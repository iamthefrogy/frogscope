    description: Points into an unclaimed cloud range with nothing answering — a takeover risk.
  - key: cert_subject_cn
    label: Certificate CN
    group: network
    type: text
    filter: search
    width: 200
    default_visible: false
  - key: cert_issuer_org
    label: Certificate issuer
    group: network
    type: enum
    filter: multiselect
    width: 180
    default_visible: false
  - key: cert_not_after
    label: Certificate expires
