# Column catalogue — the single source of truth for the grid, the CSV export,
# the drawer field order, AND the API's filter/sort whitelist. A column name
# that is not in here can never reach SQL.
#
#   type:   text host enum int float bool url list datetime
#   filter: search multiselect range bool tokens daterange none
#   group:  identity response redirect infra dns fingerprint quality provenance
#
# `default_visible: false` still means filterable and exportable — just not shown
# until the user enables it in the column picker. Any column whose fill rate is
# 0% for the selected run is auto-hidden regardless of this setting.

groups:
  identity:    {label: Identity,      order: 1}
  response:    {label: Response,      order: 2}
  redirect:    {label: Redirect,      order: 3}
  infra:       {label: Edge & hosting, order: 4}
  dns:         {label: DNS,           order: 5}
  fingerprint: {label: Technology,    order: 6}
  quality:     {label: Data quality,  order: 8}
  risk:        {label: Risk,           order: 7}
  provenance:  {label: Provenance,    order: 9}
  exposure:    {label: What is exposed, order: 10}
  network:     {label: Network & certificates, order: 11}

columns:
  # ── Identity ───────────────────────────────────────────────────────────────
  - key: endpoint_key
    label: Endpoint
    group: identity
    type: text
    filter: search
    width: 260
    default_visible: true
    description: Stable identity for diffing — lowercased host plus port.
  - key: host_display
    label: Host
    group: identity
    type: host
    filter: search
    width: 240
    default_visible: true
    description: Hostname in its originally observed casing.
  - key: host
    label: Host (normalised)
    group: identity
    type: host
    filter: search
    width: 240
    default_visible: false
    description: Lowercased, trailing-dot-stripped, punycoded. The diff key.
  - key: port
    label: Port
    group: identity
    type: int
    filter: multiselect
    width: 80
    align: right
    default_visible: true
  - key: scheme
    label: Scheme
    group: identity
    type: enum
    filter: multiselect
    width: 80
    default_visible: true
  - key: port_category
    label: Port class
    group: identity
    type: enum
    filter: multiselect
    width: 150
    default_visible: true
    description: From config/ports.yaml. Distinguishes real services from Cloudflare aliases.
  - key: env
    label: Environment
    exec_label: Environment
    group: identity
    type: enum
    filter: multiselect
    width: 120
    default_visible: true
    description: Inferred from whole hostname labels, never substrings.
  - key: env_source
    label: Env evidence
    group: identity
    type: text
    filter: search
    width: 120
    default_visible: false
    description: Which hostname token produced the environment classification.
  - key: zone
    label: Zone
    group: identity
    type: enum
    filter: multiselect
    width: 200
    default_visible: true
    description: Hostname with its leftmost label removed; groups related assets.
  - key: registrable_domain
    label: Registrable domain
    group: identity
    type: enum
    filter: multiselect
    width: 180
    default_visible: false
  - key: host_depth
    label: Label depth
    group: identity
    type: int
    filter: range
    width: 90
    align: right
    default_visible: false

  # ── Response ───────────────────────────────────────────────────────────────
  - key: response_class
