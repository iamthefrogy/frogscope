    width: 130
    default_visible: false
  - key: content_length
    label: Length
    group: response
    type: int
    filter: range
    width: 100
    align: right
    default_visible: false
  - key: words
    label: Words
    group: response
    type: int
    filter: range
    width: 80
    align: right
    default_visible: false
  - key: lines
    label: Lines
    group: response
    type: int
    filter: range
    width: 80
    align: right
    default_visible: false
  - key: response_ms
    label: Response (ms)
    group: response
    type: float
    filter: range
    width: 110
    align: right
    default_visible: false
