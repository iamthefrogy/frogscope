presets:
  triage:
    label: Triage
    columns: [endpoint_key, risk_score, risk_band, worst_severity, top_finding,
              response_class, status_code, no_waf, auth_surface_type, env]
  risk:
    label: Risk detail
    columns: [endpoint_key, risk_score, risk_band, worst_severity, exposure,
              hygiene, sensitivity, finding_count, risk_mitigated, risk_confidence]
  lifecycle:
    label: Lifecycle
    columns: [endpoint_key, eol_count, eol_worst_severity, eol_years_past,
              outdated_count, vuln_family_count, webserver, tech]
  infra:
    label: Edge & hosting
    columns: [endpoint_key, host_ip, hosting_provider, hosting_kind, cdn_name,
              cdn_type, origin_exposed, origin_health, ip_cluster_size, cname_final]
  dns:
    label: DNS
    columns: [endpoint_key, host_ip, a, aaaa, cname, cname_final, ipv6_enabled,
              dns_multi_a, resolvers]
  tech:
    label: Technology
    columns: [endpoint_key, webserver, webserver_version, version_disclosure,
              tech, tech_count, cpe_products, is_wordpress, wp_plugins]
  quality:
    label: Data quality
    columns: [endpoint_key, probe_count, intra_run_inconsistent, scheme_conflict,
              scan_artifact, cf_alias_port, response_class, scanned_at]
  network:
    label: Network & certificates
    columns: [endpoint_key, host_ip, cidr, ptr_host, ip_foreign_domain_count,
              dangling_a_record, cert_subject_cn, cert_days_remaining,
              cert_expired, cert_self_signed, tls_version]

# Saved-view presets, expressed as filters rather than columns.
filter_presets:
  - {id: origin_exposed, label: "Origin exposed and serving",
     filters: {origin_exposed: [true], serves_content: [true]}}
  - {id: nonprod_public, label: "Non-production on the internet",
     filters: {env: [dev, test, uat, ta, sit, staging, sandbox], serves_content: [true]}}
  - {id: auth_surfaces, label: "Authentication surfaces",
     filters: {auth_surface_type: ["!none"]}}
  - {id: mgmt_consoles, label: "Management consoles",
     filters: {mgmt_surface: [true]}}
  - {id: cleartext, label: "Cleartext with no HTTPS upgrade",
     filters: {no_tls_redirect: [true]}}
  - {id: broken_origin, label: "Broken or missing origin",
     filters: {origin_health: ["!ok"]}}
  - {id: critical_issues, label: "Critical and high findings",
     filters: {worst_severity: [critical, high]}}
  - {id: takeover, label: "Takeover candidates",
     filters: {takeover_grade: [high, medium]}}
  - {id: eol, label: "End-of-life software",
     filters: {eol_count: {min: 1}}}
  - {id: unmitigated_critical, label: "Critical, with nothing mitigating it",
     filters: {worst_severity: [critical], risk_mitigated: [false]}}
  - {id: real_services, label: "Real services (aliases and artefacts excluded)",
     filters: {scan_artifact: [false], cf_alias_port: [false], serves_content: [true]}}
  - {id: dangling_dns, label: "Dangling DNS records",
     filters: {dangling_a_record: [true]}}
  - {id: certs_expiring, label: "Certificates expiring or broken",
     filters: {cert_expired: [true]}}
