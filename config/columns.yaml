  # ── Provenance ─────────────────────────────────────────────────────────────
  - key: scanned_at
    label: Probed at
    group: provenance
    type: datetime
    filter: daterange
    width: 170
    default_visible: false

# Column presets offered in the picker.
  # ── Passive product identification (config/fingerprints.yaml) ──────────────
  # These say WHAT was identified. Whether it matters is decided by rules.yaml.
  - key: panel_product
    label: Product
    group: exposure
    type: text
    filter: search
    width: 180
    default_visible: true
    description: >
      Product identified from the page title, technology, CPE, favicon, or
      response body — never by requesting a path. A panel at /admin on a host
      whose root page is a marketing site will not appear here.
  - key: panel_group
    label: Console kind
    group: exposure
    type: enum
    filter: multiselect
    width: 130
    default_visible: true
    description: >
      What authority the product carries: ci_cd and infra_console can run code or
      control servers, monitoring and dev_tool mostly leak structure. Grouped this
      way because it is what a reviewer acts on.
  - key: panel_exposure
    label: Console severity
    group: exposure
    type: enum
    filter: multiselect
    width: 130
    default_visible: false
  - key: panel_confidence
    label: Match confidence
    group: exposure
    type: enum
    filter: multiselect
    width: 130
    default_visible: false
    description: >
      Confidence in the identification, separate from how bad the exposure is. A
      product-specific string is `confirmed`; a generic word other products also
      use is `possible`.
  - key: panel_count
    label: Products matched
    group: exposure
    type: int
    filter: range
    width: 100
    default_visible: false
  - key: is_default_page
    label: Default page
    group: exposure
    type: bool
    filter: bool
    width: 110
    default_visible: false
    description: >
      Still serving the out-of-the-box page, so nobody finished configuring the
      host — which usually means nobody is patching it either.
  - key: default_page_product
    label: Default page product
    group: exposure
    type: text
    filter: search
    width: 150
    default_visible: false
  - key: disclosure_count
    label: Disclosures
    group: exposure
    type: int
    filter: range
    width: 100
    default_visible: false
  - key: disclosure_worst
    label: Worst disclosure
    group: exposure
    type: enum
    filter: multiselect
    width: 130
    default_visible: true
    description: >
      Directory listings, stack traces, phpinfo, or credential-shaped strings in
      the response. Only what a root-page response reveals; anything needing a
      path request is out of scope by design.
  - key: disclosure_ids
    label: Disclosure checks
    group: exposure
    type: array
    filter: tokens
    width: 180
    default_visible: false
  - key: fingerprint_count
    label: Fingerprint matches
    group: exposure
    type: int
    filter: range
    width: 110
    default_visible: false

  # ── Network & certificates (v2: dnsx / mapcidr / tlsx correlation) ─────────
  # Empty on every run until a scan opts into "Correlate assets" — the
  # 0%-fill auto-hide already handles that, no default_visible tuning needed
  # beyond what's set here.
  - key: cidr
    label: Address block
    group: network
