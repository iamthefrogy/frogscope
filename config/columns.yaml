    default_visible: false
  - key: ip_version
    label: IP version
    group: network
    type: enum
    filter: multiselect
    width: 90
    default_visible: false
  - key: ptr_host
    label: Reverse DNS
    group: network
    type: text
    filter: search
    width: 220
    default_visible: false
    description: The PTR name this address answers to.
  - key: ptr_missing
    label: No reverse DNS
    group: network
    type: bool
    filter: bool
    width: 120
    default_visible: false
    description: Normal for CDN/anycast ranges — check cdn_name before flagging this.
  - key: ptr_mismatch
    label: Reverse DNS mismatch
    group: network
    type: bool
    filter: bool
    width: 150
    default_visible: false
    description: Answers to a different name than this hostname — often a stale record after a migration.
  - key: ip_hostname_count
