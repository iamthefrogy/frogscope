services:
  frogscope:
    build: .
    image: frogscope:latest
    # 127.0.0.1 on the LEFT is still the important part even with the v2
    # access-key gate below: defence in depth, not a substitute for it —
    # without it Docker publishes the port on every interface.
    ports:
      - "127.0.0.1:8099:8099"
    volumes:
      - frogscope-data:/data
      # Config is meant to be edited — weights, keywords, ownership. Mounting it
      # means your tuning survives a rebuild.
      - ./config:/app/config
    environment:
      # Optional API keys widen passive subdomain discovery. Everything works
      # without them; they simply find more.
      #   SUBFINDER_CONFIG: /app/config/subfinder.yaml
      FROGSCOPE_DATA_DIR: /data
      # v2: a single shared access key gates every feature — generated once
      # on first start and printed to `docker logs` if left unset here.
      # Uncomment to pin it explicitly instead (e.g. for CI, or to avoid
      # reading logs on first run):
      #   FROGSCOPE_AUTH_KEY: some-long-random-string
    restart: unless-stopped
    # Scanning needs no privileges beyond outbound network.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # A wide scan runs several subfinder processes plus one httpx/naabu
    # process each threaded in the dozens, all at once — I/O-bound (waiting
    # on the network), not CPU-hungry, so there's no `cpus` limit here.
    # Without a memory ceiling, an uncapped container under WSL2's shared VM
    # budget can get OOM-killed mid-scan with no clear signal, which looks
    # exactly like "the scan just returned fewer results this time."
    mem_limit: 2g
    ulimits:
      # Comfortable headroom over the concurrent connections a wide scan
      # opens (httpx + naabu threads + subfinder workers + SQLite/Flask).
      nofile:
        soft: 65536
        hard: 65536
    # Docker's embedded resolver / WSL2's NAT'd DNS forwarding is a known
    # source of intermittent lookup failures under load. Pinned here instead
    # of relying on it — only safe because no target domain needs an
    # internal/split-horizon resolver to resolve correctly.
    dns:
      - 1.1.1.1
      - 8.8.8.8

volumes:
  frogscope-data:
